title: Agotamiento del pool de conexiones a PostgreSQL en biblio-express
description: >-
  Dado el perfil de carga perfil-comun-v1, cuando se retengan 10 de las 10
  conexiones del pool de PostgreSQL durante 2 minutos, biblio-express no
  consumira mas del 100 % de su presupuesto de error (SLO de 95 % de
  peticiones exitosas) dentro de la ventana de inyeccion.
tags:
  - agotamiento-de-recursos
  - pool-de-conexiones
  - cloud-run
  - phol

configuration:
  base_url:
    type: env
    key: BASE_URL
    default: http://localhost:3000
  flow_path:
    type: env
    key: FLOW_PATH
    default: /api/v5/books/1
  pool_hold: 10
  fault_duration_seconds: 120

secrets:
  chaos:
    token:
      type: env
      key: CHAOS_TOKEN

extensions:
  - name: biblio-experiment
    owner: Phol
    api: biblio-express (GCP, Cloud Run)
    steady_state:
      # Valores medidos en la ronda de calibracion (perfil sin fallo).
      success_rate_min: 0.99
      p95_latency_ms_max: 150
      measured_with: k6, fase baseline del perfil-comun-v1
      calibration:
        date: 2026-11-16T05:39:33Z
        requests: 3018
        success_rate: 1.0
        p95_latency_ms: 108.4
        p99_latency_ms: 155.0
    objective_metric:
      name: Presupuesto de error consumido en la ventana de inyeccion
      unit: porcentaje del presupuesto
      instrument: k6
      k6_metric: http_req_failed{phase:fault}
      summary_field: phases.fault.errorRate
      slo_success_rate: 0.95
      formula: errorRate / (1 - slo_success_rate) * 100
      threshold_max: 100
      observation_window_seconds: 120
      target: GET /api/v5/books/:id de biblio-express
    injection:
      fault: pool-exhaustion
      resource: Pool de conexiones a PostgreSQL (pg.Pool, DB_POOL_MAX=10)
      intensity: 10 de 10 conexiones retenidas (100 %)
      duration_seconds: 120
      switch: POST /chaos/pool-exhaustion (CHAOS_ENABLED + x-chaos-token)
      load_profile: load/profile.json (perfil-comun-v1)
      timeline_seconds:
        baseline: 0-150
        fault: 150-270
        recovery: 270-330
    blast_radius:
      inside: Endpoints de biblio-express que usan la base de datos
      outside:
        - /health de biblio-express (la instancia sigue viva)
        - Instancia de Cloud SQL (las conexiones retenidas quedan ociosas)
        - API de los companeros, salvo sus llamadas a biblio-express
      data: Solo datos sinteticos (scripts/seed-synthetic-data.js)
    abort_conditions:
      - /health de biblio-express deja de responder 200 (control safeguards)
      - Interrupcion manual del operador (Ctrl+C ejecuta los rollbacks)
    automatic_rollback:
      - El interruptor libera las conexiones al cumplirse duration_seconds
      - Chaos Toolkit ejecuta siempre la seccion rollbacks
      - Tope duro del interruptor de 300 s por activacion

controls:
  - name: condiciones-de-aborto
    provider:
      type: python
      module: chaosaddons.controls.safeguards
      arguments:
        probes:
          - name: la-instancia-sigue-viva
            type: probe
            frequency: 10
            tolerance: 200
            provider:
              type: http
              url: ${base_url}/health
              timeout: 5

steady-state-hypothesis:
  title: El flujo responde 200 en menos de 2 s y no hay fallos activos
  probes:
    - name: la-api-esta-viva
      type: probe
      tolerance: 200
      provider:
        type: http
        url: ${base_url}/health
        timeout: 5
    - name: el-flujo-responde-a-tiempo
      type: probe
      tolerance: 200
      provider:
        type: http
        url: ${base_url}${flow_path}
        timeout: 2

method:
  - name: iniciar-perfil-de-carga
    type: action
    background: true
    provider:
      type: process
      path: k6
      arguments: run --quiet load/k6/flow.js
      timeout: 420

  - name: retener-conexiones-del-pool
    type: action
    pauses:
      before: 150
      after: 120
    secrets:
      - chaos
    provider:
      type: http
      method: POST
      url: ${base_url}/chaos/pool-exhaustion
      timeout: 15
      headers:
        Content-Type: application/json
        x-chaos-token: ${token}
      arguments:
        hold: ${pool_hold}
        durationSeconds: ${fault_duration_seconds}

  - name: estado-del-pool-tras-la-ventana
    type: probe
    secrets:
      - chaos
    provider:
      type: http
      url: ${base_url}/chaos/status
      timeout: 5
      headers:
        x-chaos-token: ${token}

  - name: apagar-el-fallo
    type: action
    pauses:
      after: 60
    secrets:
      - chaos
    provider:
      type: http
      method: DELETE
      url: ${base_url}/chaos/pool-exhaustion
      timeout: 5
      headers:
        x-chaos-token: ${token}

rollbacks:
  - name: liberar-las-conexiones-retenidas
    type: action
    secrets:
      - chaos
    provider:
      type: http
      method: DELETE
      url: ${base_url}/chaos/pool-exhaustion
      timeout: 5
      headers:
        x-chaos-token: ${token}

  - name: el-flujo-volvio-al-estado-estable
    type: probe
    pauses:
      before: 5
    provider:
      type: http
      url: ${base_url}${flow_path}
      timeout: 2
