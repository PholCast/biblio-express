apiVersion: apps/v1
kind: Deployment
metadata:
  name: biblio-api-v2
  namespace: biblio
spec:
  replicas: 2

  selector:
    matchLabels:
      app: biblio-api-v2

  template:
    metadata:
      labels:
        app: biblio-api-v2

    spec:
      containers:
        - name: biblio-api
          image: biblioacrphol.azurecr.io/biblio-express:v2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: biblio-api-config

            - secretRef:
                name: biblio-api-secret

          volumeMounts:
            - name: secrets-store-inline
              mountPath: /mnt/secrets-store
              readOnly: true

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: biblio-api-secrets