apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biblio-api-v2
  namespace: biblio
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: biblio-api-v2
                port:
                  number: 80