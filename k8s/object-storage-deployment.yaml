apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-storage
  namespace: biblio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: object-storage
  template:
    metadata:
      labels:
        app: object-storage
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: object-storage-sa
      containers:
        - name: object-storage
          image: biblioacrphol.azurecr.io/biblio-object-storage:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: object-storage-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
