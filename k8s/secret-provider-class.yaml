apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: biblio-api-secrets
  namespace: biblio

spec:
  provider: azure

  secretObjects:
    - secretName: biblio-api-secret
      type: Opaque
      data:
        - objectName: DATABASE-URL
          key: DATABASE_URL
        - objectName: DOCTORS-API-URL
          key: DOCTORS_API_URL
        - objectName: POKEMON-API-URL
          key: POKEMON_API_URL
        - objectName: OTEL-EXPORTER-OTLP-ENDPOINT
          key: OTEL_EXPORTER_OTLP_ENDPOINT
        - objectName: OTEL-EXPORTER-OTLP-HEADERS
          key: OTEL_EXPORTER_OTLP_HEADERS

  parameters:
    usePodIdentity: "false"
    clientID: "a7951b14-373b-476d-9772-67b84e351e7e"
    keyvaultName: "kv-biblio-phol"
    cloudName: ""
    objects: |
      array:
        - |
          objectName: DATABASE-URL
          objectType: secret
        - |
          objectName: DOCTORS-API-URL
          objectType: secret
        - |
          objectName: POKEMON-API-URL
          objectType: secret
        - |
          objectName: OTEL-EXPORTER-OTLP-ENDPOINT
          objectType: secret
        - |
          objectName: OTEL-EXPORTER-OTLP-HEADERS
          objectType: secret
    tenantId: "f43da386-8a95-4f0a-9e4c-b83fd0e0c74f"