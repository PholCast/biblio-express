apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: biblio-api-v2
  namespace: biblio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: biblio-api-v2

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 25