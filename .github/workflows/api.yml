name: API - CI/CD Azure

on:
  push:
    branches: [main]
    tags: ['api-v*']
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'prisma.config.ts'
      - 'server.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Dockerfile'
      - 'k8s/deployment.yaml'
      - 'k8s/service.yaml'
      - 'k8s/configmap.yaml'
      - 'k8s/service-account.yaml'
      - 'k8s/secret-provider-class.yaml'
      - 'k8s/hpa.yaml'
      - 'k8s/ingress.yaml'
      - 'k8s/namespace.yaml'
      - '.github/workflows/api.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: biblioacrphol
  ACR_LOGIN_SERVER: biblioacrphol.azurecr.io
  AKS_RESOURCE_GROUP: rg-biblio-azure
  AKS_CLUSTER_NAME: aks-biblio-azure
  IMAGE_NAME: biblio-express
  AKS_NAMESPACE: biblio

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select image tag
        id: image
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^api-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push image
        run: |
          docker build \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ steps.image.outputs.tag }}" \
            .
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ steps.image.outputs.tag }}"

      - name: Verify image in Azure Container Registry
        id: registry
        run: |
          digest=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "$IMAGE_NAME:${{ steps.image.outputs.tag }}" \
            --query digest \
            --output tsv)
          if [[ -z "$digest" ]]; then
            echo "ACR no devolvio un digest para la imagen publicada" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Apply API manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/service-account.yaml
          kubectl apply -f k8s/secret-provider-class.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl -n "$AKS_NAMESPACE" set image deployment/biblio-api-v2 \
            biblio-api="$ACR_LOGIN_SERVER/$IMAGE_NAME@${{ steps.registry.outputs.digest }}"
          kubectl -n "$AKS_NAMESPACE" rollout status deployment/biblio-api-v2 --timeout=180s
          deployed_image=$(kubectl -n "$AKS_NAMESPACE" get deployment/biblio-api-v2 \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="biblio-api")].image}')
          expected_image="$ACR_LOGIN_SERVER/$IMAGE_NAME@${{ steps.registry.outputs.digest }}"
          if [[ "$deployed_image" != "$expected_image" ]]; then
            echo "La imagen del Deployment no coincide con la imagen publicada" >&2
            exit 1
          fi