name: GCP Canary Deployment

on:
  workflow_dispatch:
    inputs:
      promotion_mode:
        description: "Modo de promoción Canary"
        required: true
        type: choice
        default: "manual"
        options:
          - automatic
          - manual
      deployment_stage:
        description: "Etapa manual: 0 interna, 1=10%, 2=25%, 3=100%"
        required: true
        type: choice
        default: "0"
        options:
          - "0"
          - "1"
          - "2"
          - "3"
      bake_time_seconds:
        description: "Tiempo de horneado de esta etapa (segundos)"
        required: true
        type: number
        default: 300
      canary_faults_enabled:
        description: "Habilitar inyección controlada de fallos en canary"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "prisma/**"
      - "prisma.config.ts"
      - "server.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".github/workflows/gcp-canary.yml"

permissions:
  contents: read
  id-token: write
  actions: read

env:
  PROJECT_ID: biblio-express-canary-2026
  REGION: us-central1
  REPOSITORY: biblio-api
  IMAGE_NAME: biblio-api
  TF_ROOT: canary-source/terraform-gcp
  TF_STATE_BUCKET: biblio-express-tfstate-2026-pholcast
  TF_STATE_PREFIX: biblio-express
  STABLE_VERSION: 3.0.2
  CANARY_VERSION: 4.0.0

jobs:
  wait-infrastructure:
    name: Wait for infrastructure workflow
    runs-on: ubuntu-latest
    steps:
      - name: Wait for matching infrastructure run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: gcp-infrastructure.yml
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "push" ]; then
            echo "Manual Canary execution; no matching infrastructure push run is required."
            exit 0
          fi

          run_id=""
          for attempt in {1..12}; do
            runs=$(gh run list \
              --repo "$REPOSITORY" \
              --workflow "$WORKFLOW_FILE" \
              --branch main \
              --limit 30 \
              --json databaseId,headSha,status,conclusion,event,createdAt)

            run_id=$(jq -r --arg sha "$COMMIT_SHA" '
              [.[] | select(.headSha == $sha and .event == "push")]
              | sort_by(.createdAt)
              | last
              | .databaseId // empty
            ' <<< "$runs")

            if [ -n "$run_id" ]; then
              break
            fi

            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "No infrastructure run found for commit $COMMIT_SHA; continuing."
            exit 0
          fi

          echo "Waiting for infrastructure run $run_id."
          while true; do
            run=$(gh run view "$run_id" --repo "$REPOSITORY" --json status,conclusion)
            status=$(jq -r '.status' <<< "$run")
            conclusion=$(jq -r '.conclusion // empty' <<< "$run")

            case "$status" in
              completed)
                if [ "$conclusion" != "success" ]; then
                  echo "Infrastructure workflow ended with: $conclusion"
                  exit 1
                fi
                echo "Infrastructure workflow completed successfully."
                exit 0
                ;;
              queued|in_progress)
                sleep 15
                ;;
              *)
                echo "Unexpected infrastructure workflow status: $status"
                exit 1
                ;;
            esac
          done

  deploy:
    name: Build, deploy and route traffic
    runs-on: ubuntu-latest
    needs: wait-infrastructure
    env:
      PROMOTION_MODE: ${{ inputs.promotion_mode || 'manual' }}
      DEPLOYMENT_STAGE: ${{ inputs.deployment_stage || '0' }}
      CANARY_FAULTS_ENABLED: ${{ inputs.canary_faults_enabled || false }}
      BAKE_TIME_SECONDS: ${{ inputs.bake_time_seconds || '300' }}
      TARGET_REQUESTS_PER_TRACK: "100"
      LOAD_CONCURRENCY: "20"
      MAX_OBSERVATION_SECONDS: "120"
      MAX_GATE_RETRIES: "3"

    steps:
      - name: Checkout canary source
        uses: actions/checkout@v4
        with:
          path: canary-source

      - name: Checkout stable v3 source
        uses: actions/checkout@v4
        with:
          ref: v3.0.2
          path: stable-source
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create ephemeral Terraform variables
        working-directory: ${{ env.TF_ROOT }}
        env:
          CANARY_FAULT_TOKEN: ${{ secrets.CANARY_FAULT_TOKEN }}
          OTEL_EXPORTER_ENDPOINT: ${{ secrets.OTEL_EXPORTER_ENDPOINT }}
          OTEL_EXPORTER_HEADERS: ${{ secrets.OTEL_EXPORTER_HEADERS }}
          NOTIFICATION_EMAIL: ${{ secrets.GCP_NOTIFICATION_EMAIL }}
        run: |
          cat > terraform.tfvars <<EOF
          project_id = "${PROJECT_ID}"
          create_project = false
          project_name = "Biblio Express Canary"
          region = "${REGION}"
          zone = "us-central1-a"
          environment = "demo"
          service_name = "biblio-express"
          artifact_repository_id = "${REPOSITORY}"
          stable_version = "${STABLE_VERSION}"
          canary_version = "${CANARY_VERSION}"
          cloud_sql_database = "bibliodb"
          cloud_sql_user = "biblioapp"
          cloud_sql_tier = "db-f1-micro"
          canary_fault_token = "${CANARY_FAULT_TOKEN}"
          canary_fault_latency_ms = 2000
          otel_exporter_endpoint = "${OTEL_EXPORTER_ENDPOINT}"
          otel_exporter_headers = "${OTEL_EXPORTER_HEADERS}"
          otel_exporter_otlp_protocol = "http/protobuf"
          github_repository = "${GITHUB_REPOSITORY}"
          github_branch = "main"
          notification_email = "${NOTIFICATION_EMAIL}"
          deletion_protection = false
          EOF

      - name: Initialize Terraform backend
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${TF_STATE_PREFIX}"

      - name: Verify stage 2 approval evidence
        if: env.PROMOTION_MODE == 'manual' && env.DEPLOYMENT_STAGE == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifact_id=$(gh api \
            "repos/${REPOSITORY}/actions/artifacts?per_page=100" |
            jq -r --arg artifact "canary-stage-2-approved-${GITHUB_SHA}" '
              [.artifacts[]
                | select(.name == $artifact and .expired == false)]
              | sort_by(.created_at)
              | last
              | .id // empty')

          if [ -z "$artifact_id" ]; then
            echo "No stage 2 approval artifact was found for commit ${GITHUB_SHA}."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/stage-2-evidence"
          gh api \
            "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "$RUNNER_TEMP/stage-2-evidence/evidence.zip"
          unzip -q "$RUNNER_TEMP/stage-2-evidence/evidence.zip" \
            -d "$RUNNER_TEMP/stage-2-evidence/unpacked"
          jq -e \
            --arg commit_sha "$GITHUB_SHA" '
            .decision == "promote" and
            .stage == 2 and
            .commit_sha == $commit_sha and
            (.canary_image | test("@sha256:[0-9a-f]{64}$")) and
            (.stable_image | test("@sha256:[0-9a-f]{64}$"))
          ' "$RUNNER_TEMP/stage-2-evidence/unpacked/stage-2-approved.json"
          jq -r '.stable_image, .canary_image' \
            "$RUNNER_TEMP/stage-2-evidence/unpacked/stage-2-approved.json" |
            {
              read stable_image
              read canary_image
              echo "STABLE_IMAGE=$stable_image" >> "$GITHUB_ENV"
              echo "CANARY_IMAGE=$canary_image" >> "$GITHUB_ENV"
            }
          echo "STAGE2_APPROVED=true" >> "$GITHUB_ENV"

      - name: Build and push stable v3 image
        if: env.PROMOTION_MODE != 'manual' || env.DEPLOYMENT_STAGE != '3'
        working-directory: stable-source
        run: |
          image_base="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}"
          image="${image_base}:v${STABLE_VERSION}"
          existing_digest=$(gcloud artifacts docker images describe "$image" \
            --format='value(image_summary.digest)' 2>/dev/null || true)
          if [ -n "$existing_digest" ]; then
            echo "Reusing existing stable image ${image_base}@${existing_digest}"
            echo "STABLE_IMAGE=${image_base}@${existing_digest}" >> "$GITHUB_ENV"
            exit 0
          fi
          docker build --pull -t "$image" .
          docker push "$image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
          echo "STABLE_IMAGE=$digest" >> "$GITHUB_ENV"

      - name: Build and push canary v4 image
        if: env.PROMOTION_MODE != 'manual' || env.DEPLOYMENT_STAGE != '3'
        working-directory: canary-source
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:v${CANARY_VERSION}-${GITHUB_SHA::12}"
          docker build --pull -t "$image" .
          docker push "$image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
          echo "CANARY_IMAGE=$digest" >> "$GITHUB_ENV"

      - name: Validate immutable image references
        run: |
          case "$STABLE_IMAGE" in *"@sha256:"*) ;; *) echo "Stable image has no digest"; exit 1 ;; esac
          case "$CANARY_IMAGE" in *"@sha256:"*) ;; *) echo "Canary image has no digest"; exit 1 ;; esac
          echo "Stable: $STABLE_IMAGE"
          echo "Canary: $CANARY_IMAGE"

      - name: Calculate traffic split
        run: |
          stable_percent=$((100 - CANARY_PERCENT))
          echo "STABLE_PERCENT=$stable_percent" >> "$GITHUB_ENV"

      - name: Plan infrastructure and traffic
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform plan -input=false \
            -var-file=terraform.tfvars \
            -var="stable_image=${STABLE_IMAGE}" \
            -var="canary_image=${CANARY_IMAGE}" \
            -var="stable_traffic_percent=${STABLE_PERCENT}" \
            -var="canary_traffic_percent=${CANARY_PERCENT}" \
            -var="canary_faults_enabled=${CANARY_FAULTS_ENABLED}"

      - name: Apply infrastructure and traffic
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform apply -input=false -auto-approve \
            -var-file=terraform.tfvars \
            -var="stable_image=${STABLE_IMAGE}" \
            -var="canary_image=${CANARY_IMAGE}" \
            -var="stable_traffic_percent=${STABLE_PERCENT}" \
            -var="canary_traffic_percent=${CANARY_PERCENT}" \
            -var="canary_faults_enabled=${CANARY_FAULTS_ENABLED}"

      - name: Smoke test canary at 0% public traffic
        if: env.CANARY_PERCENT == '0'
        working-directory: ${{ env.TF_ROOT }}
        run: |
          canary_url=$(terraform output -raw canary_service_url)
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          for attempt in {1..12}; do
            status=$(curl --silent --show-error \
              --retry 2 \
              -H "x-canary: true" \
              -D "$response_file" \
              -o /dev/null \
              -w "%{http_code}" \
              "${canary_url}/api/v4/books" || true)
              track=$(awk 'BEGIN { IGNORECASE=1 } /^x-app-track:/ { print $2 }' "$response_file" | tr -d '\r')
              if [ "$status" -ge 200 ] && [ "$status" -lt 500 ] && [ "$track" = "canary" ]; then
                echo "Canary smoke test passed with x-canary: true (HTTP ${status})."
                exit 0
              fi
            sleep 10
          done

          echo "Canary smoke test failed or did not return X-App-Track: canary."
          exit 1

      - name: Bake current traffic stage
        if: env.BAKE_TIME_SECONDS != '0'
        run: |
          case "$BAKE_TIME_SECONDS" in
            ''|*[!0-9]*) echo "BAKE_TIME_SECONDS must be a non-negative integer"; exit 1 ;;
          esac
          echo "Baking ${CANARY_PERCENT}% canary traffic for ${BAKE_TIME_SECONDS} seconds."
          sleep "$BAKE_TIME_SECONDS"

      - name: Show deployment outputs
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform output
