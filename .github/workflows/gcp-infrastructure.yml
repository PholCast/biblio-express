name: GCP Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "terraform-gcp/**"
      - ".github/workflows/gcp-infrastructure.yml"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: biblio-express-canary-2026
  REGION: us-central1
  REPOSITORY: biblio-api
  TF_ROOT: terraform-gcp
  TF_STATE_BUCKET: biblio-express-tfstate-2026-pholcast
  TF_STATE_PREFIX: biblio-express
  PLACEHOLDER_IMAGE: us-docker.pkg.dev/cloudrun/container/hello

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create infrastructure variables
        working-directory: ${{ env.TF_ROOT }}
        env:
          CANARY_FAULT_TOKEN: ${{ secrets.CANARY_FAULT_TOKEN }}
          OTEL_EXPORTER_ENDPOINT: ${{ secrets.OTEL_EXPORTER_ENDPOINT }}
          OTEL_EXPORTER_HEADERS: ${{ secrets.OTEL_EXPORTER_HEADERS }}
        run: |
          cat > terraform.tfvars <<EOF
          project_id = "${PROJECT_ID}"
          create_project = false
          project_name = "Biblio Express Canary"
          region = "${REGION}"
          zone = "us-central1-a"
          environment = "demo"
          service_name = "biblio-express"
          artifact_repository_id = "${REPOSITORY}"
          stable_image = "${PLACEHOLDER_IMAGE}"
          canary_image = "${PLACEHOLDER_IMAGE}"
          stable_version = "3.0.2"
          canary_version = "4.0.0"
          stable_traffic_percent = 100
          canary_traffic_percent = 0
          cloud_sql_database = "bibliodb"
          cloud_sql_user = "biblioapp"
          cloud_sql_tier = "db-f1-micro"
          canary_faults_enabled = false
          canary_fault_latency_ms = 2000
          canary_fault_token = "${CANARY_FAULT_TOKEN}"
          otel_exporter_endpoint = "${OTEL_EXPORTER_ENDPOINT}"
          otel_exporter_headers = "${OTEL_EXPORTER_HEADERS}"
          otel_exporter_otlp_protocol = "http/protobuf"
          github_repository = "${GITHUB_REPOSITORY}"
          github_branch = "main"
          notification_email = ""
          deletion_protection = false
          EOF

      - name: Initialize Terraform backend
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${TF_STATE_PREFIX}"

      - name: Validate Terraform
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate

      - name: Create project APIs, registry, database, secrets and IAM
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform apply -input=false -auto-approve \
            -var-file=terraform.tfvars \
            -target=module.project \
            -target=module.artifact_registry \
            -target=module.cloud_sql \
            -target=module.secrets \
            -target=module.iam

      - name: Show bootstrap outputs
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform output github_workload_identity_provider
          terraform output github_deployer_service_account
